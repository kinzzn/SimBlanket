<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐Embed测试</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 30px; }
    .status { color: gray; font-size: 14px; }
  </style>
</head>
<body>
  <h1>音乐Embed可用性测试</h1>
  <p class="status">如果能看到播放器并试听，说明该平台在国内可用</p>

  <h2>1. Spotify</h2>
  <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/0m0u3UWu1h3up8IxlvgS2l?utm_source=generator" width="100%" height="152" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

  <h2>2. 网易云音乐</h2>
  <iframe src="https://music.163.com/outchain/player?type=2&id=1901371647&auto=0&height=66" width="100%" height="86" frameborder="no"></iframe>

  <h2>3. QQ音乐</h2>
  <iframe src="https://i.y.qq.com/n2/m/share/details/song.html?songid=004Z8Ih00aOtQp" width="100%" height="300" frameborder="no"></iframe>

  <h2>4. Apple Music</h2>
  <iframe src="https://embed.music.apple.com/cn/album/1744753937?i=1744753945" width="100%" height="175" frameborder="no" allow="autoplay; encrypted-media"></iframe>
</body>
</html>
